services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zap
      POSTGRES_USER: zap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zap}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zap -d zap"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://zap:${POSTGRES_PASSWORD:-zap}@postgres:5432/zap
      REDIS_URL: redis://redis:6379/0
      SEARCH_CACHE_BACKEND: redis
      RATE_LIMIT_BACKEND: redis
      PRICE_ALERT_WORKER_MODE: external
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${WEBHOOK_PORT:-8080}:${WEBHOOK_PORT:-8080}"

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://zap:${POSTGRES_PASSWORD:-zap}@postgres:5432/zap
      REDIS_URL: redis://redis:6379/0
      SEARCH_CACHE_BACKEND: redis
      RATE_LIMIT_BACKEND: redis
      PRICE_ALERT_WORKER_MODE: external
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
