[project]
name = "autoparts-telegram-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.22,<4",
  "aiohttp>=3.9,<4",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "pydantic-settings>=2.6,<3",
  "redis>=5,<6",
  "asyncpg>=0.29,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
